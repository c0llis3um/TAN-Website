workflows:
  ios-simulator-build:
    name: iOS Simulator Build (no signing required)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    triggering:
      events: []  # manual only — trigger builds from the Codemagic dashboard, not on every push
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app + sync Capacitor iOS
        script: npm run cap:sync
      - name: Build for iOS Simulator (no code signing needed)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/**/*.app

